name: 每日自检更新

on:
  schedule:
    - cron: "7 21 * * *"   # UTC 21:07 = 北京时间 05:07
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行自检脚本
        run: python3 scripts/daily_update.py

      - name: 提交变更
        run: |
          git config user.name "tvbox-bot"
          git config user.email "tvbox-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "每日自检 $(date -u +%F)"
            git pull --rebase origin main || true
            git push
          fi
